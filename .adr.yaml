# The decision registry for relais.
#
# Most decisions relais lives under are FLEET decisions, made once in the
# `decisions` repository and vendored below (the code paradigm and canons,
# CI from the first commit, releases on a version tag, SemVer, the guidance
# block). A record here deciding one of their slots would be a
# contradiction, not an override. The keys below are relais's own: product
# questions no other repository has.
#
# relais is also a CONSUMER of this corpus at runtime: `[[architecture.mapping]]`
# in relais.toml maps paths to keys, and every run resolves them through
# `aval` for the worker's context package (SPEC §7). Until this file existed,
# `[integrations] aval = "required"` was satisfied by the binary being on
# PATH and nothing more — the tool relais makes workers consult had no
# corpus to consult in relais itself.
#
# `aval add github:fredericrous/decisions` refreshes the pack; nothing tells
# this repository when a fleet decision changes, so `aval add --check` asks.

packs:
  - .adr/packs/decisions.pack

# No scopes of this repository's own. Keys only for questions the fleet
# does not answer; their records live in `dir`.
scopes: []
dir: .adr/records
keys:
  routing.session-model:
    description: Whether relais chooses the model of the person's own Claude Code session, and within what authority
  learning.automatic-promotion:
    description: Whether relais promotes a gate-passing task artifact without a person, inside what envelope, and how it rolls back
  learning.classifier-capture:
    description: Whether relais keeps the text of the session router's classifier calls to train a local model, where, for how long, and what leaves the machine
  decisions.who-answers:
    description: Who may answer a run waiting on a person, how the answer records who decided, and what counts as the person's judgment
  decisions.advisor:
    description: Whether a model advises a decision, how relais calls it, and whether its advice can gate an answer
  trust.scope:
    description: What a trust grant names (a repository or one exact policy), and what relais does when the commands it would run change
  routing.task-type-research:
    description: Whether a change may run below the implementation tier, on what evidence, what keeps a Sonnet arm accruing beside it, and what rolls it back
  workspace.local-reuse:
    description: Where a local run works (a fork with copy-on-write dependencies, or the caller's own linked worktree) and what a server or CI run keeps
  execution.resource-budgets:
    description: How a run spends time on a loaded machine (work, admission wait, disk wait and total), what each budget's exhaustion ends as, and why resource exhaustion is evidence rather than a verdict
  execution.settle-before-asking:
    description: Which stops a run settles itself before asking a person (minor review findings, a tests-only scope overflow, a reviewer with no result), and the bound on each

# Which parts of this repository have which traits (aval 1.7, SEMANTICS
# section 2.5), as `aval traits --detect` proposed and a reviewer accepted.
# Rules about a trait not named here are left out of the session hook and
# counted; `aval rules --all-traits` lists them. `aval traits --check`, run
# by this repository's gate, reports a package this stops describing.
areas:
  # cli: crates/relais/Cargo.toml — `crates/relais/src/main.rs`
  "crates/relais/**": [cli]
