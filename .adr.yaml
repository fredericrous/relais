# The decision registry for relais.
#
# This repository declares no architectural questions of its own yet: every
# decision it lives under is a FLEET decision, made once in the `decisions`
# repository and vendored below (the code paradigm and canons, CI from the
# first commit, releases on a version tag, SemVer, the guidance block). A
# record here deciding one of their slots would be a contradiction, not an
# override.
#
# relais is also a CONSUMER of this corpus at runtime: `[[architecture.mapping]]`
# in relais.toml maps paths to keys, and every run resolves them through
# `aval` for the worker's context package (SPEC §7). Until this file existed,
# `[integrations] aval = "required"` was satisfied by the binary being on
# PATH and nothing more — the tool relais makes workers consult had no
# corpus to consult in relais itself.
#
# `aval add github:fredericrous/decisions` refreshes the pack; nothing tells
# this repository when a fleet decision changes, so `aval add --check` asks.

packs:
  - .adr/packs/decisions.pack

# No scopes and no keys of this repository's own: everything answerable here
# comes from the pack. Declare a key here the day relais has a question the
# fleet does not answer.
scopes: []
keys:

# Which parts of this repository have which traits (aval 1.7, SEMANTICS
# section 2.5), as `aval traits --detect` proposed and a reviewer accepted.
# Rules about a trait not named here are left out of the session hook and
# counted; `aval rules --all-traits` lists them. `aval traits --check`, run
# by this repository's gate, reports a package this stops describing.
areas:
  # cli: crates/relais/Cargo.toml — `crates/relais/src/main.rs`
  "crates/relais/**": [cli]
