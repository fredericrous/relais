schema_version = 1

# Profiles the router selects among. Explicit model IDs keep policies
# reproducible; the effective model is recorded on every dispatch.
[models.research]
id = "haiku"

[models.implementation]
id = "sonnet"
effort = "medium"

[models.escalation]
# An alias, like the two tiers above, and deliberately not the dated id:
# `backend::model_matches` treats a bare word as an alias and accepts any
# `claude-opus-*` the harness reports, while `claude-opus-5-5` would
# demand exact equality and turn a dated variant into an unapproved
# substitution — a run that fails after the worker has been paid (#49).
id = "opus"
effort = "medium"

[execution]
max_attempts = 3
max_repairs_before_escalation = 1
# 45 minutes, from measurement rather than taste: a package that adds a
# ledger migration and changes a signature across five modules took 18:00
# of a 20:00 budget on one attempt (run-65c118139b020-1000173c4) and hit
# the ceiling on the next (run-65c1220d566ab-100012142, killed at exactly
# 1200 s with nothing to show). A wall clock a real package fits in only
# on a good day buys interrupted runs, and an interrupted run has already
# paid for its worker.
max_wall_seconds = 2700
allow_nested_agents = true
max_agent_depth = 3
max_agents_total = 24

# required blocks execution when missing; optional gaps are reported and
# never counted as passed checks.
[integrations]
aval = "required"
amont = "required"
amont_agent = "required"

# `make check`'s gates, one check each (plan C3), so a red verdict names
# the gate, each gate has its own clock, and only `make plugin` retries.
#
# Except `make msrv` and `make audit`, which CI runs on every pull request
# (jobs `msrv` and `audit`) and a candidate does not need again here
# (docs/plans/2026-10-31-one-change-one-test-run.md, A1). msrv was a whole
# second build on the floor toolchain per candidate and per uncached base;
# a newer std API still fails `make lint` through clippy's
# `incompatible_msrv`, and newer syntax fails CI's `msrv` job before merge.
# audit's findings are advisory and never fail the target, so it said
# nothing about a candidate.
#
# Timeouts are from measurement rather than taste: each target run once at
# 172a69c2 (2026-10-20), then three times that, rounded up to a minute,
# never under 300 s. Three times is the headroom the single `make check`
# had (614 s measured, 1800 s allowed): this machine runs these under
# parallel agent load (the load average was 14 to 74 during the
# measurement), and a limit that holds only on an idle machine turns a
# healthy base into `baseline_unrunnable`, which blocks every candidate
# before a worker is dispatched.
[[verification.profiles.default.setup]]
argv = ["make", "toolchain"]
# Measured 0 s: the pinned toolchain was already installed.
timeout_seconds = 300

[[verification.profiles.default.commands]]
argv = ["make", "lint"]
# Measured 10 s (fmt, clippy -D warnings, warm build).
timeout_seconds = 300

[[verification.profiles.default.commands]]
argv = ["make", "test"]
# Measured 367 s on 2026-10-25, after the fork tests stopped waiting, from
# a fresh worktree with the build included (the library's tests 139 s,
# release_scenarios 117 s). Weight 2: it is the heaviest command on the machine, so
# it takes two heavy slots. It writes no JUnit (plain `cargo test`), so no
# `junit` is declared and the pre-existing shortcut does not apply to it.
# Raised from 1020 s on 2026-10-29: it took 837 s at a load average near
# 150 and timed out at 1020 s near 110, each time making the base
# `baseline_unrunnable`; 1800 s is the single `make check`'s old limit.
timeout_seconds = 1800
weight = 2

[[verification.profiles.default.commands]]
argv = ["make", "plugin"]
# Measured 62 s. The one check that may retry: its suite has known
# timing-sensitive tests, and under relais (`RELAIS_CHECK`) this retry
# owns the rerun `scripts/plugin-test.sh` does in CI.
timeout_seconds = 300
retry = 1

# A candidate that touches what the profile's verdict depends on — build
# manifests, lockfiles, the test tree, fixtures, or a program the profile
# runs — is reviewed explicitly whatever the route said (SPEC §10). The
# built-in list covers the common ones; add this repository's own here.
# [verification.profiles.default]
# inputs = ["scripts/check.sh", "ci/**"]
# Cache baseline results by base tree, profile and toolchain (SPEC §18).
# Only a base whose every check passed is cached; a base with a failed
# check is re-run each time.
# Off by default: only a profile with no undeclared external dependency
# and no nondeterministic check is safe to cache.
# cache_baseline = true
#
# On since relais 0.24.0, which caches only an all-green base, so a flaky
# failure is never kept as pre-existing.
[verification.profiles.default]
cache_baseline = true

# Risk floors: writes touching these patterns cannot route below the
# minimum tier, and the review requirement here is a floor, not a hint.
# Floors apply to the DECLARED scope: a contract scoped `src/**` could
# write `src/trust/x`, so a `**/trust/**` rule floors it — scope
# contracts as narrowly as the task allows.
# This repository has no trust/ or restore/ tree; a rule on them would
# only floor every `**` scope to the escalation tier (see
# docs/AUDIT-2026-09-20.md, A10). The adapter and the coordinator are
# the authority-bearing code here.
[[risk]]
paths = ["crates/relais/src/adapter/**", "crates/relais/src/coordinator/**", "crates/relais/src/admission/**"]
minimum_tier = "implementation"
review = "required"

# Path-to-aval-key mappings. aval resolves exact keys; it has no
# source-impact analysis, so the mapping lives here (SPEC §7).
#
# The corpus these resolve against is vendored at `.adr/packs/decisions.pack`
# (see `.adr.yaml`): relais declares no decisions of its own, and every key
# below is a FLEET decision. A worker changing this crate gets the paradigm
# and the two code canons in its context package, which is the same service
# relais offers the repositories it runs in.
[[architecture.mapping]]
paths = ["crates/**"]
keys = ["code.paradigm", "code.practice-canon", "code.functional-canon"]

# The workflows and the Makefile are where the CI and release decisions are
# actually implemented, so a change to them resolves those.
[[architecture.mapping]]
paths = [".github/workflows/**", "Makefile"]
keys = [
    "ci.presence",
    "ci.system",
    "ci.test-gate-stage",
    "build.toolchain-source",
    "release.trigger",
    "release.version-scheme",
]

# Change work routes on the implementation tier — what the built-in floor
# already picks, declared as a recipe so a candidate revision can be
# replayed and compared against it (SPEC §24-25).
[[recipes]]
name = "change-routing"
revision = 1
kind = "change"
scope_within = ["**"]
tier = "implementation"

# One recipe per task type (docs/plans/2026-10-12-task-types.md): each type
# has its own revision chain, so `relais recipe rollback change-<type>`
# returns only that type. Same scope and tier as `change-routing`, so
# routing is unchanged; a replay measures rev 2 of a name at the research
# tier. `-designed` recipes cover only a contract that names a design.

[[recipes]]
name = "change-mechanical"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["mechanical"]
tier = "implementation"

[[recipes]]
name = "change-pattern"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["pattern"]
tier = "implementation"

[[recipes]]
name = "change-review-fix"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["review-fix"]
tier = "implementation"

[[recipes]]
name = "change-feature"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["feature"]
tier = "implementation"

[[recipes]]
name = "change-refactor"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["refactor"]
tier = "implementation"

[[recipes]]
name = "change-ui"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["ui"]
tier = "implementation"

[[recipes]]
name = "change-infra"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["infra"]
tier = "implementation"

[[recipes]]
name = "change-feature-designed"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["feature"]
requires_design = true
tier = "implementation"

[[recipes]]
name = "change-refactor-designed"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["refactor"]
requires_design = true
tier = "implementation"

[[recipes]]
name = "change-pattern-designed"
revision = 1
kind = "change"
scope_within = ["**"]
task_type = ["pattern"]
requires_design = true
tier = "implementation"
