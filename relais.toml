schema_version = 1

# Profiles the router selects among. Explicit model IDs keep policies
# reproducible; the effective model is recorded on every dispatch.
[models.research]
id = "haiku"

[models.implementation]
id = "sonnet"
effort = "medium"

[models.escalation]
id = "fable"
effort = "medium"

[execution]
max_attempts = 3
max_repairs_before_escalation = 1
# 45 minutes, from measurement rather than taste: a package that adds a
# ledger migration and changes a signature across five modules took 18:00
# of a 20:00 budget on one attempt (run-65c118139b020-1000173c4) and hit
# the ceiling on the next (run-65c1220d566ab-100012142, killed at exactly
# 1200 s with nothing to show). A wall clock a real package fits in only
# on a good day buys interrupted runs, and an interrupted run has already
# paid for its worker.
max_wall_seconds = 2700
allow_nested_agents = true
max_agent_depth = 3
max_agents_total = 24

# required blocks execution when missing; optional gaps are reported and
# never counted as passed checks.
[integrations]
aval = "required"
amont = "required"
amont_agent = "required"

[[verification.profiles.default.commands]]
argv = ["make", "check"]
timeout_seconds = 300

# A candidate that touches what the profile's verdict depends on — build
# manifests, lockfiles, the test tree, fixtures, or a program the profile
# runs — is reviewed explicitly whatever the route said (SPEC §10). The
# built-in list covers the common ones; add this repository's own here.
# [verification.profiles.default]
# inputs = ["scripts/check.sh", "ci/**"]
# Cache baseline results by base SHA, profile and toolchain (SPEC §18).
# Off by default: only a profile with no undeclared external dependency
# and no nondeterministic check is safe to cache.
# cache_baseline = true

# Risk floors: writes touching these patterns cannot route below the
# minimum tier, and the review requirement here is a floor, not a hint.
# Floors apply to the DECLARED scope: a contract scoped `src/**` could
# write `src/trust/x`, so a `**/trust/**` rule floors it — scope
# contracts as narrowly as the task allows.
# This repository has no trust/ or restore/ tree; a rule on them would
# only floor every `**` scope to the escalation tier (see
# docs/AUDIT-2026-09-20.md, A10). The adapter and the coordinator are
# the authority-bearing code here.
[[risk]]
paths = ["crates/relais/src/adapter/**", "crates/relais/src/coordinator/**", "crates/relais/src/admission/**"]
minimum_tier = "implementation"
review = "required"

# Path-to-aval-key mappings. aval resolves exact keys; it has no
# source-impact analysis, so the mapping lives here (SPEC §7).
#
# The corpus these resolve against is vendored at `.adr/packs/decisions.pack`
# (see `.adr.yaml`): relais declares no decisions of its own, and every key
# below is a FLEET decision. A worker changing this crate gets the paradigm
# and the two code canons in its context package, which is the same service
# relais offers the repositories it runs in.
[[architecture.mapping]]
paths = ["crates/**"]
keys = ["code.paradigm", "code.practice-canon", "code.functional-canon"]

# The workflows and the Makefile are where the CI and release decisions are
# actually implemented, so a change to them resolves those.
[[architecture.mapping]]
paths = [".github/workflows/**", "Makefile"]
keys = [
    "ci.presence",
    "ci.system",
    "ci.test-gate-stage",
    "build.toolchain-source",
    "release.trigger",
    "release.version-scheme",
]
