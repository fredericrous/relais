# Repo-local check policy. Committed, and must be accepted once per machine
# with `amont trust` before any command here runs.

# Architecture decisions must still resolve. `aval check` rebuilds the decision
# graph and fails on a duplicate id, a supersession edge pointing at nothing,
# competing heads for one key, a key decided outside the scopes it declares, a
# stale HEADS.md, or a citation that no longer resolves.
#
# Scope is `*`, not `*.md`: links-resolve reads the whole tree, so renaming a
# cited file must run the gate, and a markdown-only trigger would miss exactly
# the change that breaks a citation. The `+.adr.yaml` half keeps it inert in any
# repository without a registry.
#
# `docs-skip`: an edit to an EXISTING documentation file (.md, .mdx, .rst,
# .adoc, outside adr/) does not run it. An added, deleted or renamed file, any
# code change and any decision record still do, because those are what can
# break a citation. A skipped run is not stamped as a pass.
#
# A missing binary is reported as a gap and does NOT block — install it with
# install/install.sh from github.com/fredericrous/aval.
pre-commit  adr  *+.adr.yaml  block  docs-skip aval check

# The `areas:` in .adr.yaml are a reviewed declaration of which parts of this
# repository are a command line or a UI, and they decide which fleet rules the
# session hook shows. This blocks when a package stops matching them (exit 1)
# or cannot be inspected (exit 3). Detection is advisory: a false positive
# belongs under `disclaims:` in .adr.yaml, with the reason beside it. Skipped on
# the same documentation-only edits as `adr` above.
pre-commit  traits  *+.adr.yaml  block  docs-skip aval traits --check

# The test suite at commit time, stamped: `pre-push-cargo-test` (amont's own)
# skips a tree a clean commit-time run already vouched for, so a push does not
# rerun the suite on a loaded machine. The short name ties the two together.
# The scope is everything the tests read: the crate, its manifests, and the
# Claude Code plugin the binary embeds (build.rs) — its TypeScript, JSON and
# agent/skill markdown under claude-plugin/. Markdown is in scope only where a
# test reads it: that directory, and the hook payload fixtures under crates/.
# README, CHANGELOG, AGENTS, CLAUDE and docs/ are not read by any test, so
# editing them no longer runs the suite. A push still gates on every commit
# that touches this scope, so a code commit made without the hook is not
# excused by a later docs one.
pre-commit  cargo-test  *.rs,*.toml,Cargo.lock,*.ts,*.json,claude-plugin/**/*.md,crates/**/*.md  block  cargo test

# CI's lint job also refuses a dependency cycle between modules (`make lint`);
# a cycle reached CI on 2026-10-11 (#207) because nothing here ran that check.
pre-commit  module-cycles  crates/**/*.rs  block  python3 scripts/check-module-cycles.py

# The plugin's own suite (`claude plugin test`, CI's plugin job). `cargo test`
# rebuilds the plugin the binary embeds but never runs its tests, so before
# this a plugin change reached CI untested locally (#221, 2026-10-12). A scope
# names no directory, so it is the plugin's file types: every `.ts` in the
# repository is the plugin's, and its two manifests. Its markdown (agents,
# skills) is left to CI: `*.md` would run the suite on every doc edit. `make
# plugin` is the target `make check` and CI run.
pre-commit  plugin-test  *.ts,plugin.json,hooks.json  block  make plugin

# amont:pack:start github:fredericrous/adr-lint 5e86c9043f30030fb992c8ac3f814aa64158e6ea
pre-commit  adr-lint-check  *.rs,*.ts,*.tsx,*.go,*.py+.adr.yaml  warn  files adr-lint check --
# amont:pack:end github:fredericrous/adr-lint
