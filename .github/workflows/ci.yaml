name: CI

# `make check` — toolchain, lint, test, msrv, audit, plugin — on every push to
# main and every pull request, so a green check on the PR means what a
# green `make check` means on the workstation. One exception, by decision
# (ADR-0041, `ci.platform-schedule`): a pull request runs `test` on macOS,
# relais's primary platform, and defers Ubuntu and Windows to the push to
# main unless it touches platform code or carries `full-ci` (`plan` below);
# the release waits for all three on main (release.yaml, `platforms`). The jobs mirror the
# Makefile targets one for one; change a flag in one place, change it in
# the other. The msrv floor, the audit command and the Claude Code version
# the plugin job installs are READ from the repository (Cargo.toml, the
# Makefile) rather than restated here.

on:
  push:
    branches: ["main"]
  pull_request:
    # `labeled` too: adding `full-ci` re-plans the run with every platform.
    types: [opened, synchronize, reopened, labeled]
  # For `audit`: a new advisory against a crate in the tree appears
  # without anybody pushing anything. Monday morning, so it is read at the
  # start of a week.
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub's DEFAULT shell is `bash -e {0}` — no pipefail. Only naming bash
# explicitly gets `bash -eo pipefail {0}`; without it a `make test | tee`
# reports tee's exit status and a failing suite goes green.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # `make lint`: the two commands, exactly.
  lint:
    name: lint (fmt, clippy -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the build toolchain; rustup on the runner
      # honours it, so this is the same clippy the Makefile runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The third command of `make lint`: the module graph is acyclic and
      # `policy` is pure. Python 3 is on the runner image and on the
      # workstation; nothing else is installed for this.
      - run: python3 scripts/check-module-cycles.py
      # The fourth and fifth: no cycle between the children of the two
      # split modules, which check-module-cycles.py cannot see (it stops at
      # the top-level module).
      - run: python3 scripts/check-child-cycles.py crates/relais/src/ledger
      - run: python3 scripts/check-child-cycles.py crates/relais/src/runner
      # The deletion check's pure logic, on fixtures (no cargo, no network).
      - run: python3 scripts/test_mutants_check.py
      # The CI platform scripts (classifier, plan, release guard), on
      # fixtures and a throwaway history.
      - run: python3 scripts/test_ci_platform.py
      # general.no-disabled-safety: the clippy settings that refuse a
      # reasonless `#[allow]` are still in Cargo.toml (ADR-0044). The
      # release tarball is pinned by its checksum, so a moved tag fails here.
      # CI only, not `make lint`: a contributor need not install adr-lint to
      # build relais, and the commit gate's clippy already refuses an `#[allow]`.
      - name: adr-lint sync --check
        env:
          ADR_LINT: "0.8.0"
          ADR_LINT_SHA256: 4298718e843d5253ed84a64a4b7ed98ee5bab5bd3dc0d0bd1aeb59920d92be03
        run: |
          name="adr-lint-$ADR_LINT-x86_64-unknown-linux-gnu"
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/fredericrous/adr-lint/releases/download/v$ADR_LINT/$name.tar.gz"
          echo "$ADR_LINT_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$name/adr-lint" sync --check

  # `make test`: the library suite plus the release scenarios, which drive
  # the real binary against a fake `claude`, a temporary repository and a
  # lazily started coordinator. A macOS leg on purpose: the coordinator's
  # Unix-socket path limits and process-group handling differ by platform,
  # and the product ships to a macOS workstation. A Windows leg because
  # the coordinator's endpoint and process handling are a different
  # implementation there (`ipc`, `procs`); the scenarios are `cfg(unix)`
  # (the fake `claude` is a shell script), the library suite is not.
  #
  # Which legs run is `plan`'s answer: macOS always; Ubuntu and Windows on
  # main, on the schedule, and on a pull request that touches platform code
  # or carries `full-ci`. A deferred leg is named in the run summary.
  plan:
    name: which platforms this run tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_other: ${{ steps.plan.outputs.run_other }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's base must be reachable to say what it changed.
          fetch-depth: 0
      - id: platform
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          out=$(./scripts/ci-platform-touched.sh "$BASE")
          printf '%s\n' "$out"
          echo "touched=$(printf '%s\n' "$out" | tail -n 1)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PLATFORM_CODE: ${{ steps.platform.outputs.touched || 'true' }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: ./scripts/ci-platform-plan.sh

  test:
    name: test (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v4
      # Skips `cargo test` only when a signature by a key in
      # .github/allowed_signers covers this exact tree on this leg's
      # platform; anything else runs it. Not on `schedule`: that run exists
      # to catch drift no push made, so it must never skip. The platform is
      # named, not left to the runner's default, so the leg and the
      # attestation it accepts are read in one place (`plan`'s matrix).
      - id: attest
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: fredericrous/attest@v1
        with:
          platform: ${{ matrix.platform }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # The scenarios commit in a temporary repository; git wants an
      # identity. Hooks are disabled per fixture, not here.
      - run: |
          git config --global user.email "ci@relais.invalid"
          git config --global user.name "relais ci"
      - id: suite
        if: ${{ !contains(fromJSON(steps.attest.outputs.gates || '[]'), 'pre-push-cargo-test') }}
        run: cargo test
      # The third state a reader must be able to tell apart from "ran" and
      # "deferred": already proven by a signature (`ci.a-deferred-job-says-so`).
      - if: ${{ contains(fromJSON(steps.attest.outputs.gates || '[]'), 'pre-push-cargo-test') }}
        run: |
          echo "test (${{ matrix.os }}): skipped, a signature covers this tree on ${{ matrix.platform }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # One result file per leg, uploaded for `sign`: a matrix job's outputs
      # collapse to one value, so the legs cannot report through `outputs`.
      # The file says whether THIS leg ran the suite and passed.
      - name: record the suite result
        if: ${{ always() }}
        env:
          RAN: ${{ steps.suite.outcome == 'success' }}
          OS: ${{ matrix.os }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/sign-results"
          jq -n --arg os "$OS" --arg platform "$PLATFORM" --argjson ran "$RAN" \
            '{os: $os, platform: $platform, ran: $ran}' \
            > "$RUNNER_TEMP/sign-results/$OS.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sign-result-${{ matrix.os }}
          path: ${{ runner.temp }}/sign-results/${{ matrix.os }}.json

  # `make msrv`: the floor `rust-version` claims, actually compiled
  # against. Without this, `rust-version` is a string nothing tests.
  msrv:
    # Literal, not `${{ env.MSRV }}`: the env context is unavailable in a
    # job's name and renders empty rather than erroring. The version
    # itself is READ from Cargo.toml below, never restated here — a
    # hardcoded floor drifts from the one the crate claims, and the job
    # then proves the wrong thing (C12).
    name: msrv (the crate builds on the declared floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: floor
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^[[:space:]]*rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ -n "$msrv" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "declared floor: $msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "${{ steps.floor.outputs.msrv }}" --profile minimal --no-self-update
      - run: cargo "+${{ steps.floor.outputs.msrv }}" build

  # `make plugin`: the relais Claude Code plugin (claude-plugin/) validated and
  # tested by the Claude Code it claims to be tested on. The version is READ
  # from the Makefile (CLAUDE_CODE_PIN, 2.1.291 today), so the workstation
  # range and this install cannot drift. `claude plugin test` needs no
  # sign-in and no network, so nothing here is a secret.
  plugin:
    name: plugin (validate, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: pin
        run: |
          set -euo pipefail
          version=$(sed -n 's/^CLAUDE_CODE_PIN := //p' Makefile | head -n 1)
          [ -n "$version" ] || { echo "::error::the Makefile declares no CLAUDE_CODE_PIN"; exit 1; }
          echo "pinned Claude Code: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm i -g @anthropic-ai/claude-code@${{ steps.pin.outputs.version }}
      - run: make plugin

  # The dependency tree, watched. `make audit` — the same target a
  # workstation runs, so `make check` and CI cannot drift (C12).
  # `cargo install --locked cargo-audit`, not a marketplace action:
  # pulling an unaudited third-party action into the job whose purpose is
  # supply-chain hygiene is self-defeating.
  #
  # NON-BLOCKING, deliberately: an advisory is information about a
  # dependency, not a defect in the change under review, and a scheduled
  # run that goes red on somebody else's disclosure trains people to
  # ignore red. Findings surface as ::warning:: annotations. The RELEASE
  # workflow's own audit job does block on a vulnerability.
  audit:
    name: make audit (advisory, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1
      - name: Install cargo-audit
        run: command -v cargo-audit > /dev/null || cargo install --locked cargo-audit
      - name: Audit the resolved tree
        run: |
          set -euo pipefail
          make audit 2>&1 | tee audit.txt
          if grep -Eq 'RUSTSEC-[0-9]{4}-[0-9]{4}' audit.txt; then
            echo "::warning::cargo audit reported findings (advisory; see the job log)"
          fi

  # Sign the gate the test legs ran, once per platform it ran on, so the next
  # job that checks out this tree can skip it (decisions ADR-0041,
  # `ci.attested-skip`; plan C2). Push to main only: a pull request never holds
  # the key. A leg whose suite an attestation skipped signs nothing, so only
  # real runs are signed. Keyed off `needs.test.result` and each leg's own
  # `suite` step outcome: a leg whose run failed never reaches this job, since
  # `needs` requires success.
  sign:
    name: sign attestations
    needs: [test, plan]
    if: ${{ always() && needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v4
      # Each leg's result, read in place of the matrix outputs: the sign step
      # below runs only when this leg's own file says the suite ran and passed.
      - uses: actions/download-artifact@v4
        with:
          pattern: sign-result-${{ matrix.os }}
          path: ${{ runner.temp }}/sign-results
      - id: ran
        env:
          OS: ${{ matrix.os }}
        run: |
          f="$RUNNER_TEMP/sign-results/$OS.json"
          if [ -f "$f" ] && [ "$(jq -r '.ran' "$f")" = true ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "sign: $OS ran no suite (an attestation covered it, or it failed): nothing to sign"
          fi
      - name: sign pre-push-cargo-test for this platform
        if: ${{ steps.ran.outputs.sign == 'true' }}
        uses: fredericrous/attest/sign@c5c61817f5a78c3a23d31c903c00ba1eef50cc39 # v1.7.0
        with:
          key: ${{ secrets.ATTEST_SIGNING_KEY }}
          gates: pre-push-cargo-test
          platform: ${{ matrix.platform }}
          producer: attest-sign-${{ matrix.os }}
