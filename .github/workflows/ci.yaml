name: CI

# `make check` — toolchain, lint, test, msrv, audit — on every push to
# main and every pull request, so a green check on the PR means what a
# green `make check` means on the workstation. The jobs mirror the
# Makefile targets one for one; change a flag in one place, change it in
# the other. The msrv floor and the audit command are READ from the
# repository (Cargo.toml, the Makefile) rather than restated here.

on:
  push:
    branches: ["main"]
  pull_request:
  # For `audit`: a new advisory against a crate in the tree appears
  # without anybody pushing anything. Monday morning, so it is read at the
  # start of a week.
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub's DEFAULT shell is `bash -e {0}` — no pipefail. Only naming bash
# explicitly gets `bash -eo pipefail {0}`; without it a `make test | tee`
# reports tee's exit status and a failing suite goes green.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # `make lint`: the two commands, exactly.
  lint:
    name: lint (fmt, clippy -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the build toolchain; rustup on the runner
      # honours it, so this is the same clippy the Makefile runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The third command of `make lint`: the module graph is acyclic and
      # `policy` is pure. Python 3 is on the runner image and on the
      # workstation; nothing else is installed for this.
      - run: python3 scripts/check-module-cycles.py

  # `make test`: the library suite plus the release scenarios, which drive
  # the real binary against a fake `claude`, a temporary repository and a
  # lazily started coordinator. A macOS leg on purpose: the coordinator's
  # Unix-socket path limits and process-group handling differ by platform,
  # and the product ships to a macOS workstation. A Windows leg because
  # the coordinator's endpoint and process handling are a different
  # implementation there (`ipc`, `procs`); the scenarios are `cfg(unix)`
  # (the fake `claude` is a shell script), the library suite is not.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # The scenarios commit in a temporary repository; git wants an
      # identity. Hooks are disabled per fixture, not here.
      - run: |
          git config --global user.email "ci@relais.invalid"
          git config --global user.name "relais ci"
      - run: cargo test

  # `make msrv`: the floor `rust-version` claims, actually compiled
  # against. Without this, `rust-version` is a string nothing tests.
  msrv:
    # Literal, not `${{ env.MSRV }}`: the env context is unavailable in a
    # job's name and renders empty rather than erroring. The version
    # itself is READ from Cargo.toml below, never restated here — a
    # hardcoded floor drifts from the one the crate claims, and the job
    # then proves the wrong thing (C12).
    name: msrv (the crate builds on the declared floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: floor
        run: |
          set -euo pipefail
          msrv=$(sed -n 's/^[[:space:]]*rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ -n "$msrv" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "declared floor: $msrv"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "${{ steps.floor.outputs.msrv }}" --profile minimal --no-self-update
      - run: cargo "+${{ steps.floor.outputs.msrv }}" build

  # The dependency tree, watched. `make audit` — the same target a
  # workstation runs, so `make check` and CI cannot drift (C12).
  # `cargo install --locked cargo-audit`, not a marketplace action:
  # pulling an unaudited third-party action into the job whose purpose is
  # supply-chain hygiene is self-defeating.
  #
  # NON-BLOCKING, deliberately: an advisory is information about a
  # dependency, not a defect in the change under review, and a scheduled
  # run that goes red on somebody else's disclosure trains people to
  # ignore red. Findings surface as ::warning:: annotations. The RELEASE
  # workflow's own audit job does block on a vulnerability.
  audit:
    name: make audit (advisory, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1
      - name: Install cargo-audit
        run: command -v cargo-audit > /dev/null || cargo install --locked cargo-audit
      - name: Audit the resolved tree
        run: |
          set -euo pipefail
          make audit 2>&1 | tee audit.txt
          if grep -Eq 'RUSTSEC-[0-9]{4}-[0-9]{4}' audit.txt; then
            echo "::warning::cargo audit reported findings (advisory; see the job log)"
          fi
